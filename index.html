<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MedPrep — MBBS Quiz Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Landing-specific overrides */
    body { overflow-x: hidden; }
    .landing-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bg-primary);
    }
    .landing-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(108,99,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,212,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(255,107,107,0.07) 0%, transparent 60%);
      pointer-events: none;
    }
    .landing-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(108,99,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .landing-hero {
      position: relative; z-index: 1;
      text-align: center; padding: 2rem 1.5rem;
      max-width: 700px; width: 100%;
      animation: fadeInUp 0.8s ease both;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: .5rem;
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.4);
      border-radius: 100px; padding: .35rem 1rem;
      font-size: .78rem; font-weight: 600; color: var(--accent);
      letter-spacing: .06em; text-transform: uppercase; margin-bottom: 1.8rem;
    }
    .hero-title {
      font-size: clamp(2.6rem, 7vw, 4.5rem);
      font-weight: 800; line-height: 1.08;
      margin: 0 0 1.2rem;
      background: linear-gradient(135deg, #fff 30%, rgba(108,99,255,.9) 70%, #00d4ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-sub {
      font-size: 1.1rem; color: var(--text-muted); max-width: 480px; margin: 0 auto 2.5rem;
      line-height: 1.7; font-weight: 400;
    }
    .hero-cta {
      display: inline-flex; align-items: center; gap: .6rem;
      background: var(--accent); color: #fff;
      padding: .9rem 2.2rem; border-radius: 12px;
      font-size: 1rem; font-weight: 600; text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 8px 32px rgba(108,99,255,.35);
    }
    .hero-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(108,99,255,.5); }
    .hero-stats {
      display: flex; gap: 2.5rem; justify-content: center; margin-top: 3rem;
      flex-wrap: wrap;
    }
    .stat-item { text-align: center; }
    .stat-num {
      font-size: 2rem; font-weight: 700; color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-lbl { font-size: .78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
    .subjects-preview {
      position: relative; z-index: 1;
      display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
      padding: 1.5rem; animation: fadeInUp 0.8s ease .15s both;
    }
    .prev-chip {
      display: flex; align-items: center; gap: .5rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: .6rem 1.1rem;
      font-size: .88rem; color: var(--text-secondary); font-weight: 500;
      transition: border-color .2s, background .2s;
    }
    .prev-chip:hover { border-color: var(--accent); background: rgba(108,99,255,.08); }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="landing-bg"></div>
  <div class="landing-grid"></div>
  <div class="landing-wrap">
    <div class="landing-hero">
      <div class="hero-badge">⚕️ Personal MBBS Platform</div>
      <h1 class="hero-title">Master Medicine,<br/>One Question<br/>at a Time.</h1>
      <p class="hero-sub">Your personal MBBS question bank. Structured topics, instant feedback, and smart performance tracking.</p>
      <a href="dashboard.html" class="hero-cta">Open Dashboard →</a>
      <div class="hero-stats">
        <div class="stat-item"><div class="stat-num" id="lTotalQ">—</div><div class="stat-lbl">Questions</div></div>
        <div class="stat-item"><div class="stat-num" id="lSubjects">3</div><div class="stat-lbl">Subjects</div></div>
        <div class="stat-item"><div class="stat-num" id="lTopics">18+</div><div class="stat-lbl">Topics</div></div>
      </div>
    </div>
    <div class="subjects-preview">
      <a href="subject.html?subject=Psychiatry" class="prev-chip">🧠 Psychiatry</a>
      <a href="subject.html?subject=Anatomy" class="prev-chip">🦴 Anatomy</a>
      <a href="subject.html?subject=Physiology" class="prev-chip">❤️ Physiology</a>
    </div>
  </div>
  <script>
    // Static GitHub Pages fallback (no backend/API needed)
    const totalQuestions = localStorage.getItem('total_questions') || '0';
    const totalSubjects = localStorage.getItem('subjects_count') || '3';
    const totalTopics = localStorage.getItem('topics_count') || '18+';

    const totalQEl = document.getElementById('lTotalQ');
    const subjectsEl = document.getElementById('lSubjects');
    const topicsEl = document.getElementById('lTopics');

    if (totalQEl) totalQEl.textContent = totalQuestions;
    if (subjectsEl) subjectsEl.textContent = totalSubjects;
    if (topicsEl) topicsEl.textContent = totalTopics;

    // apply saved theme
    const t = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  </script>
</body>
</html>
